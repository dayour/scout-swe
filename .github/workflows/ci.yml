name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (tsc project references)
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Build docs (Docusaurus)
        run: npm run docs:build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python bindings
        run: pip install ./python
      - name: Import check
        run: python -c "import scout_swe; print('scout_swe', scout_swe.__version__)"
