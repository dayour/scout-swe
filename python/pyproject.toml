[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-swe"
version = "0.1.0"
description = "Python bindings for the DarbotLM Scout control plane (scout-api)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daryl Yourk" }]
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.urls]
Homepage = "https://github.com/dayour/scout-swe"

[tool.setuptools.packages.find]
where = ["."]
include = ["scout_swe*"]
